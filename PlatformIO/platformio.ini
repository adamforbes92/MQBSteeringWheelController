; MFSW Controller — one codebase, two PCBs. Pick the board with -e:
;
;   pio run -e esp32dev            V1/V2 boards: ESP32 DevKit V1 on headers
;   pio run -e esp32-s3            S3 board: ESP32-S3-WROOM-1-N16R8 soldered down,
;                                  native USB-C, on-board LDO, BOOT/RESET buttons
;
;   pio run -e <env> -t upload / -t uploadfs        firmware / web UI (data/)
;   python tools/make_release.py --env <env>        package Releases/V<ver>/ (or V<ver>-S3/)
;
; Each env sets ONE of -DMFSW_BOARD_DEVKIT / -DMFSW_BOARD_S3; the pin maps key off
; those in include/board.h + include/defs.h.

[platformio]
default_envs = esp32dev
; Keep transient build/dependency files off the Google-Drive folder — Drive
; locking cached library build dirs causes spurious full rebuilds and
; "[WinError 5] Access is denied" / "[WinError 145] directory is not empty".
build_dir = ${sysenv.SYSTEMDRIVE}/.platformio/mqbsteeringwheel-pio/build
libdeps_dir = ${sysenv.SYSTEMDRIVE}/.platformio/mqbsteeringwheel-pio/libdeps

; ---- shared by every board ----------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600   ; 2x the 460800 board default; matches the other projects
lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson
  robtillaart/X9C10X
; "LIN master portable" is vendored locally in lib/ (not pulled via lib_deps)
; so we can patch it — see lib/LIN master portable/src/LIN_master_Base.h
; getRawRxBuffer() for why.

; ---- V1/V2 boards: ESP32 DevKit V1 (WROOM-32) -----------------------------------
[env:esp32dev]
board = esp32dev
board_build.partitions = partitions_mqbsteeringwheelcontroller.csv
build_flags =
  -DMFSW_BOARD_DEVKIT=1

; ---- S3 board: ESP32-S3-WROOM-1-N16R8 soldered down -----------------------------
[env:esp32-s3]
board = esp32-s3-devkitc-1
; The N16R8 module carries 16 MB flash; the devkitc-1 manifest assumes 8 MB, so
; both the builder and the uploader need telling.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.partitions = partitions_mqbsteeringwheelcontroller_16MB.csv
; The module's 8 MB octal PSRAM is not needed by this firmware and is left
; disabled (nothing to probe at boot). To use it: add -DBOARD_HAS_PSRAM to
; build_flags and set  board_build.arduino.memory_type = qio_opi
;
; Console + esptool run over the module's native USB (IO19/IO20, USB-Serial-
; JTAG) — there is no CH340 on this board. Keep DTR/RTS deasserted so opening a
; serial monitor doesn't drop the chip into download mode.
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -DMFSW_BOARD_S3=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
